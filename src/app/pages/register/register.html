
<div class="auth-page">
  <a class="auth-brand" routerLink="/">🎓 CampusEvents</a>

  <div class="auth-card register-card">
    <div class="auth-icon">✨</div>

    <h1>Create Account</h1>
    <p class="auth-subtitle">
      Join CampusEvents and explore your campus.
    </p>

    <form (ngSubmit)="onRegister()">
      <label for="name">Full Name</label>
      <input
        id="name"
        type="text"
        name="name"
        [(ngModel)]="name"
        placeholder="Enter your full name"
        autocomplete="name"
        required />

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        autocomplete="email"
        required />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Create a password"
        minlength="6"
        required />

      <label for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="Re-enter your password"
        required />

      <p class="form-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p *ngIf="successMessage" style="color: green">
        {{ successMessage }}
      </p>

      <button class="login-button" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Create Account →' }}
      </button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a routerLink="/login">Login here</a>
    </p>

    <a class="back-home" routerLink="/">← Back to Home</a>
  </div>
</div>
